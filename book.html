<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Bay | Bayzo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html" aria-label="Bayzo home">
      <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
        <polygon points="20,3 35,11.5 35,28.5 20,37 5,28.5 5,11.5" fill="none" stroke="#cfa65a" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M15.5 11.5V28.5" stroke="#cfa65a" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <circle cx="21" cy="22.5" r="5.6" fill="none" stroke="#cfa65a" stroke-width="2.6"/>
      </svg>
      <span>bayzo</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="pricing.html">Pricing</a>
      <a href="book.html" aria-current="page">Book</a>
    </nav>
  </header>

  <main>
    <h2>Book a bay</h2>
    <p class="lead">Pick a service, a bay, and a time. We are open from 8 AM to 8 PM.</p>

    <form id="booking-form">
      <label for="customer_name">Your name</label>
      <input type="text" id="customer_name" required>

      <label for="customer_email">Email</label>
      <input type="email" id="customer_email" required>

      <label for="service">Service</label>
      <select id="service" required></select>

      <label for="bay">Bay</label>
      <select id="bay" required></select>

      <label for="booking_date">Date</label>
      <input type="date" id="booking_date" required>

      <label for="start_hour">Start time</label>
      <select id="start_hour" required></select>

      <label for="duration_hours">Duration</label>
      <select id="duration_hours" required></select>

      <button type="submit">Book now</button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script src="book.js"></script>
</body>
</html>
