<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Bay | Bayzo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bayzo</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#services">Services</a>
      <a href="pricing.html">Pricing</a>
      <a href="book.html">Book</a>
    </nav>
  </header>

  <main>
    <h2>Book a bay</h2>
    <p>Pick a service, a bay, and a time. We are open from 8 AM to 8 PM.</p>

    <form id="booking-form">
      <label for="customer_name">Your name</label>
      <input type="text" id="customer_name" required>

      <label for="customer_email">Email</label>
      <input type="email" id="customer_email" required>

      <label for="service">Service</label>
      <select id="service" required></select>

      <label for="bay">Bay</label>
      <select id="bay" required></select>

      <label for="booking_date">Date</label>
      <input type="date" id="booking_date" required>

      <label for="start_hour">Start time</label>
      <select id="start_hour" required></select>

      <label for="duration_hours">Duration</label>
      <select id="duration_hours" required></select>

      <button type="submit">Book now</button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script src="book.js"></script>
</body>
</html>
